{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "image-detection-pipeline.fullname" . }}
spec:
  hosts:
    - {{ .Values.istio.host }}
  gateways:
    - {{ .Values.istio.gateway }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "image-detection-pipeline.fullname" . }}-frontend
            port:
              number: {{ .Values.frontend.service.port }}
{{- end }}